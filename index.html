<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Captain Calamares System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=League+Spartan:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — left sidebar per surface (Admin HQ / Branch), topbar with surface switch, content panel.
   Captain Calamares brand (from captaincalamaresph.com): sunshine yellow, royal blue, wave cyan, mascot orange. League Spartan body, chunky Lilita One headings. */
:root{
  --bg:#f3f6fd; --panel:#ffffff; --ink:#0b1f4d; --muted:#506089; --line:#d9e1f2;
  --navy:#143f9e; --navy-ink:#ffffff; --navy-mute:#b4c8f5; --sea:#1c63d6; --sea-ink:#ffffff; --sea-soft:#dce8fc;
  --orange:#ffdf00; --orange-soft:#fff7bf; --mascot:#ff8a1f; --wave:#19c3f0; --good:#1f8a4c; --good-soft:#dff3e6; --warn:#a85f00; --warn-soft:#fdf0d2;
  --bad:#c23b3b; --bad-soft:#fbe3e3; --info:#2a64b5; --info-soft:#e0ebfa;
  --f-display:'Lilita One','Trebuchet MS',sans-serif; --f-body:'League Spartan',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07112b; --panel:#0f1d42; --ink:#eaf0ff; --muted:#9fb0d8; --line:#22356b;
  --navy:#091a45; --navy-ink:#eaf0ff; --navy-mute:#8da4d9; --sea:#5b9bff; --sea-ink:#07112b; --sea-soft:#14275a; --orange:#ffdf00; --orange-soft:#3a3410;
  --good:#4cc47f; --good-soft:#12361f; --warn:#e6a43c; --warn-soft:#3a2d10; --bad:#ef7676; --bad-soft:#3d1a1a; --info:#6ea4ee; --info-soft:#152d4d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07112b; --panel:#0f1d42; --ink:#eaf0ff; --muted:#9fb0d8; --line:#22356b;
  --navy:#091a45; --navy-ink:#eaf0ff; --navy-mute:#8da4d9; --sea:#5b9bff; --sea-ink:#07112b; --sea-soft:#14275a; --orange:#ffdf00; --orange-soft:#3a3410;
  --good:#4cc47f; --good-soft:#12361f; --warn:#e6a43c; --warn-soft:#3a2d10; --bad:#ef7676; --bad-soft:#3d1a1a; --info:#6ea4ee; --info-soft:#152d4d; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;font-weight:500;padding-left:0;padding-right:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;min-height:0;padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 12px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:17px;line-height:1.05;display:block}
.brand small{color:var(--navy-mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav{overflow:auto;padding:4px 10px 16px;flex:1}
.nav h6{margin:16px 8px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-mute);font-weight:700}
.nav button{display:flex;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--navy-ink);gap:8px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--orange);color:#0b1f4d;font-weight:700}
.nav button.dim{color:var(--navy-mute)}
.nav .pill{margin-left:auto;font-size:10px;background:rgba(255,255,255,.14);border-radius:99px;padding:1px 7px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;background:var(--panel);border-bottom:3px solid var(--orange);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--sea-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.themebtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;color:var(--muted)}
.content{overflow:auto;padding:22px max(24px,env(safe-area-inset-right,0px)) 40px 24px;flex:1;min-height:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--f-display);font-size:26px;margin:0;font-weight:600;text-wrap:balance}
.ph p{margin:3px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--sea)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#1a1205}
.btn.sea{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700}
.kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.mono{font-family:var(--f-mono);font-size:12.5px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.c-good{background:var(--good-soft);color:var(--good)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-info{background:var(--info-soft);color:var(--info)} .c-sea{background:var(--sea-soft);color:var(--sea)} .c-mute{background:var(--bg);color:var(--muted)}
.field{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--ink);font:inherit;min-width:0}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 86px;gap:10px;align-items:center}
.bar i{display:block;height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--sea);border-radius:6px}
.bar:first-child i u{background:var(--orange)}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.prod:hover{border-color:var(--orange)}
.prod .ph2{height:74px;display:grid;place-items:center;font-size:34px;background:var(--orange-soft)}
.prod div.t{padding:10px 12px}
.prod b{display:block;font-size:13.5px}
.prod span{color:var(--muted);font-size:12.5px}
.cart{position:sticky;top:0}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line small{color:var(--muted);display:block}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--bg);padding:0}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.big{font-family:var(--f-display);font-size:22px;font-weight:600;padding-top:10px}
/* clock */
.clock{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;align-items:start}
.pin{text-align:center}
.clk{font-family:var(--f-display);font-size:42px;font-weight:600;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:10px;justify-content:center;margin:12px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--sea)}
.dots i.on{background:var(--sea)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
.keys button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;font-family:var(--f-display)}
.keys button:active{background:var(--sea-soft)}
.msg{min-height:44px;margin-top:12px;border-radius:10px;padding:10px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 18px;border-radius:10px;font-weight:600;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.stepper{display:flex;gap:0;overflow-x:auto;margin:4px 0 14px}
.stepper span{flex:none;font-size:11px;padding:4px 10px;background:var(--bg);color:var(--muted);border:1px solid var(--line);margin-right:-1px;white-space:nowrap}
.stepper span.on{background:var(--sea);color:#fff;border-color:var(--sea);font-weight:700}
.stepper span.done{background:var(--sea-soft);color:var(--sea)}

.plate{background-color:var(--orange);border-radius:12px;background-origin:content-box;padding:8px;box-sizing:content-box}
.viewf{position:relative;aspect-ratio:4/3;max-width:300px;margin:0 auto;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#1b2f66,#0b1636)}
.viewf svg{position:absolute;inset:0;width:100%;height:100%}
.viewf .rec{position:absolute;left:10px;top:8px;color:#ff6b6b;font-size:11px;font-weight:700;letter-spacing:.08em}
.viewf.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:fl .45s ease-out forwards}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.thumb{display:inline-grid;place-items:center;width:34px;height:34px;object-fit:cover;vertical-align:middle;border-radius:50%;background:var(--sea-soft);color:var(--sea);font-size:10px;font-weight:700;margin-right:4px;border:2px solid var(--sea)}
.thumb.off{background:none;border:2px dashed var(--line);color:var(--muted)}

/* Login */
.login{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.login[hidden]{display:none}
.lbrand{background:repeating-conic-gradient(from 0deg at 50% 70%,#ffe51a 0 7.5deg,#ffd800 7.5deg 15deg);color:#0b1f4d;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lbrand .brand b{color:#0b1f4d}.lbrand .brand small{color:#143f9e}
.lbrand h2{font-family:var(--f-display);font-size:48px;line-height:1.02;margin:12px 0 14px;font-weight:400;text-wrap:balance;color:#ffc83d;-webkit-text-stroke:9px #1646b0;paint-order:stroke fill;text-shadow:0 5px 0 #0e2f7a;letter-spacing:.01em}
.lbrand p{color:#12388f;max-width:36ch;margin:0;font-weight:600;position:relative}
.lbrand .waves{width:100%}
.lbrand .hero{position:relative;z-index:1;padding-bottom:70px}
.lbrand .waves{position:absolute;left:0;right:0;bottom:0;opacity:.9;pointer-events:none}
.lform{display:grid;place-items:center;padding:32px max(24px,env(safe-area-inset-right,0px)) 32px 24px;overflow:auto}
.lform form{width:100%;max-width:380px;display:grid;gap:14px}
.lform h1{font-size:28px}
.lform label{display:grid;gap:6px;font-weight:600;font-size:13px}
.lform .field{width:100%;padding:11px 12px}
.lerr{color:var(--bad);font-weight:600;min-height:18px;margin:0}
.demo{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.demo small{color:var(--muted)}
@media (max-width:860px){
  .login{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .lbrand{padding:20px 16px 56px}.lbrand h2{font-size:28px}.lbrand p{display:none}
  .lform{place-items:start center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;overflow-x:auto;padding-right:8px}
  .brand{padding:8px 12px;flex:none}.brand small{display:none}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;flex:1}.nav h6{display:none}.nav button{white-space:nowrap;width:auto}
  .pos,.clock{grid-template-columns:1fr}.cart{position:static}
  .bar{grid-template-columns:90px minmax(0,1fr) 70px}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

.content{background:transparent}
.card{border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow)}
.card h3{font-family:var(--f-body);font-weight:700;font-size:14px;letter-spacing:.01em;color:var(--ink)}
h1{font-family:var(--f-body);font-weight:700;font-size:26px;letter-spacing:-.01em;color:var(--ink);display:block;padding:0;line-height:1.15}
h1::after{content:none}
.ph p{margin-top:4px;font-weight:500}
.btn{border:1px solid var(--edge);border-radius:10px;font-weight:600;box-shadow:none;background:var(--panel);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--royal);transform:none;box-shadow:none}
.btn:active{transform:none;box-shadow:none;background:var(--bg)}
.btn.pri{background:var(--royal);border-color:var(--royal);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sea{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.sm{box-shadow:none}
.field{border:1px solid var(--edge);border-radius:10px;background:var(--panel)}
.field:focus-visible{outline:2px solid var(--royal);outline-offset:0}
.chip{border:0;font-weight:600}
.cats button{border:1px solid var(--edge);box-shadow:none}
.cats button[aria-pressed="true"]{background:var(--royal);color:var(--pri-ink);border-color:var(--royal)}
.seg{border:1px solid var(--edge);border-radius:10px;padding:3px;background:var(--bg)}
.seg button{border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--royal);color:var(--pri-ink)}
.themebtn{border:1px solid var(--edge);border-radius:10px;background:var(--panel);color:var(--ink);font-weight:600}
.top{border-bottom:1px solid var(--edge)}
/* KPI strip */
.g4{gap:0;border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);background:var(--panel);overflow:hidden}
.g4>.card{border:0;border-radius:0;box-shadow:none;border-right:1px solid var(--edge);background:none}
.g4>.card:last-child{border-right:0}
.kpi b{font-family:var(--f-body);font-weight:700;font-size:28px;color:var(--ink);letter-spacing:-.01em}
/* tables */
thead th{background:var(--bg);color:var(--muted);border-bottom:1px solid var(--edge);font-weight:700}
tbody tr:hover td{background:var(--bg)}
td{border-bottom:1px solid var(--edge)}
.card.tw{padding:0;overflow:hidden}
.card.tw>h3{padding:14px 16px 6px}
/* sidebar */
.side{background:var(--navy)}
.plate{background-color:#fff;border-radius:10px}
.nav h6{font-family:var(--f-body);font-weight:700;color:var(--navy-mute);letter-spacing:.12em;font-size:10.5px}
.nav button{border-radius:8px;font-weight:600}
.nav button[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 #ffdf00}
.nav button .pill{background:#ffdf00;color:#0b1f4d;font-weight:700}
/* products */
.pimg{display:block;width:100%;height:84px;background-size:cover;background-position:center;background-repeat:no-repeat;border-bottom:1px solid var(--edge)}
.pimg.sm{display:inline-block;width:40px;height:40px;vertical-align:middle;margin-right:10px;border:1px solid var(--edge);border-radius:8px}
.pimg.bites{background-color:#ffeeb8}.pimg.drinks{background-color:#dff6fd}.pimg.dips{background-color:#ffe9c4}.pimg.sides{background-color:#fff6c2}
.pimg svg{display:block;width:100%;height:100%;padding:10px;box-sizing:border-box}
.pimg.sm svg{padding:4px}
.prod{border:1px solid var(--edge);border-radius:12px;box-shadow:var(--shadow);transition:border-color .12s}
.prod:hover{border-color:var(--royal);transform:none;box-shadow:var(--shadow)}
.prod:active{transform:none;background:var(--bg)}
.prod span{font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--ink)}
.tot.big{font-family:var(--f-body);font-weight:700}
.stepper span{border:1px solid var(--edge)}
.stepper span.on{background:var(--royal);border-color:var(--royal);color:var(--pri-ink)}
.bar i u{background:var(--royal)}
.bar:first-child i u{background:#f5b400}
.toast{border:0}
/* login */
.lbrand{background:linear-gradient(160deg,#16449f 0%,#0c2461 100%);color:#fff}
.lbrand .brand b{color:#fff}.lbrand .brand small{color:#b4c8f5;letter-spacing:.1em}
.lbrand .logo{background-color:#fff;border-radius:14px;box-sizing:content-box;background-origin:content-box;padding:10px}
.lbrand h2{font-family:var(--f-body);font-weight:700;font-size:40px;line-height:1.1;color:#fff;-webkit-text-stroke:0;text-shadow:none;letter-spacing:-.01em;margin:8px 0 12px}
.lbrand p{color:#c9d8ff;font-weight:500}
.lbrand .waves{width:100%;opacity:.35}
.shot{width:200px;height:200px;border-radius:18px;border:4px solid #fff;box-shadow:0 16px 36px rgba(0,0,0,.35);transform:rotate(-3deg);background-size:cover;background-position:center;margin-bottom:28px}
.lform .btn.pri{box-shadow:none}
.lform h1::after{content:none}
.clk,.keys button{font-family:var(--f-body);font-weight:700}
.clk{letter-spacing:-.01em}
@media (max-width:860px){
  .g4>.card{border-right:0;border-bottom:1px solid var(--edge)}
  .g4>.card:last-child{border-bottom:0}
  h1{font-size:22px}
  .lbrand h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const days=[['Fri',78],['Sat',86],['Sun',74],['Mon',92],['Tue',121],['Wed',148],['Thu',138]];
function salesChart(){
  const W=420,H=150,pl=8,pr=8,pt=14,pb=24,mx=160;
  const x=i=>pl+i*(W-pl-pr)/(days.length-1), y=v=>H-pb-(v/mx)*(H-pb-pt);
  const line=days.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[1]).toFixed(1)).join(' ');
  const area=line+' L'+x(days.length-1)+' '+(H-pb)+' L'+x(0)+' '+(H-pb)+'Z';
  const last=days.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales per day for the last 7 days in thousands of pesos, rising to 138 on Thursday">
   ${[0,80,160].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}
   <path d="${area}" fill="var(--royal)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--royal)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${x(last)}" cy="${y(days[last][1])}" r="6" fill="#fff" stroke="var(--royal)" stroke-width="3.5"/>
   <text x="${x(last)-8}" y="${y(days[last][1])-12}" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink)">\u20b1138k today</text>
   ${days.map((d,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===last?'end':'middle'}" font-size="11" fill="var(--muted)">${d[0]}</text>`).join('')}</svg>`;
}
function pDashA(){

  `<div class="grid g4">${kpi('Total sales (week)',peso(total),'<span class="up">▲ 8.4%</span> vs last week')}${kpi('Overdue invoices',peso(47320),'3 branches · oldest 9 days')}${kpi('Branch POs waiting','3','1 needs approval today')}${kpi('Staff clocked in',onNow,'across '+branches.length+' branches')}</div>

   <div class="card"><h3>Sales, last 7 days</h3>${salesChart()}<h3 style="margin-top:16px">Top branches this week</h3><div class="bars">${branches.map(b=>`<div class="bar"><span>${b.n.split(',')[0].replace(/^\d+ /,'').slice(0,16)}</span><i><u style="width:${b.sales/max*100}%"></u></i><b class="mono" style="text-align:right">${peso(b.sales)}</b></div>`).join('')}</div></div>
   <div class="card"><h3>System alerts</h3>
    <div class="alert"><span class="dot" style="background:var(--bad)"></span><div><b>Ana Cruz did not time out</b> yesterday<br><small style="color:var(--muted)">Cainta · flagged for manager review</small></div></div>
    <div class="alert"><span class="dot" style="background:var(--warn)"></span><div><b>Invoice INV-0128 overdue</b> · 20 WALTERMART TAYTAY ${peso(15720)}<br><small style="color:var(--muted)">Due Nov 10</small></div></div>
    <div class="alert"><span class="dot" style="background:var(--warn)"></span><div><b>Low stock at HQ:</b> squid rings (frozen) · 18 kg left<br><small style="color:var(--muted)">Reorder point 40 kg</small></div></div>

   </div></div>`;

/* ---------- Real camera (falls back to a placeholder where the browser blocks it) ---------- */
let camStream=null,camState='idle'; // idle | asking | live | fail
function showLive(on){
  const v=document.getElementById('camv'),sv=document.getElementById('camsvg'),rc=document.getElementById('camrec'),nt=document.getElementById('camNote');
  if(v)v.hidden=!on; if(sv)sv.style.display=on?'none':''; if(rc)rc.hidden=!on;
  if(nt)nt.textContent=on?'Live camera. The photo stays in this browser tab and is not uploaded.':(camState==='asking'?'Asking for camera permission\u2026':'No camera access here, so a placeholder photo is used. Open the demo in its own browser tab and allow the camera for a real photo.');
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}if(camState!=='fail')camState='idle'}
async function attachCam(){
  const v=document.getElementById('camv'); if(!v)return;
  if(camStream){if(v.srcObject!==camStream){v.srcObject=camStream;v.play().catch(()=>{})}showLive(true);return}
  if(camState==='fail'){showLive(false);return}
  if(camState==='asking'){showLive(false);return}
  camState='asking';showLive(false);
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    if(!pending){st.getTracks().forEach(t=>t.stop());camState='idle';return}
    camStream=st;camState='live';attachCam();
  }catch(err){camState='fail';if(pending)showLive(false)}
}
function shot(){
  const v=document.getElementById('camv');
  if(!camStream||!v||!v.videoWidth)return true; // placeholder photo
  const c=document.createElement('canvas');c.width=160;c.height=120;
  const w=v.videoWidth,h=v.videoHeight,cw=Math.min(w,h*4/3),ch=cw*3/4;
  const x=c.getContext('2d');x.translate(160,0);x.scale(-1,1);
  x.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,160,120);
  return c.toDataURL('image/jpeg',0.7);
}

  const open=punches.find(x=>x.e===emp.id&&x.date==='Nov 19'&&!x.out);

   <button class="btn pri" data-rfgo style="width:100%;padding:12px">${refMode==='Void'?'Void order '+o.no:'Refund '+peso(amt)}</button>`:`<p style="color:var(--muted);margin:0">Pick an order on the left to start.</p>`;
  return head('Refund Order','Refund items or void a whole order. A manager PIN is required.','')+
  `<div class="clock"><div class="card"><h3>1. Find the order</h3><input class="field" id="rfq" placeholder="Search order number" value="${refQ}" aria-label="Search order" style="width:100%;margin-bottom:8px">${cand.map(c=>`<button class="line" style="width:100%;border:0;border-bottom:1px dashed var(--line);text-align:left;color:inherit;${c.no===refSel?'background:var(--sea-soft)':'background:none'}" data-rs="${c.no}"><div><b class="mono">${c.no}</b><small>${c.t} \u00b7 ${c.type} \u00b7 ${c.items.length} line(s)</small></div><b>${peso(oTot(c)-(c.ref||0))}</b></button>`).join('')||'<p style="color:var(--muted)">No refundable orders match.</p>'}</div>
  <div class="card">${right}${mm}</div></div>`;
}

const pages={'b-ord':pOrd,'b-ref':pRef,'a-br':pBr,'a-mem':pMem,'a-prod':pProd,'b-prod':pProd,'a-dash':pDashA,'a-po':pPO,'a-att':pAttA,'a-emp':pEmp,'b-dash':pDashB,'b-pos':pPOS,'b-clock':pClock,'b-att':pAttB,'b-emp':pEmp,'b-po':pPOB};
function render(){$('#content').innerHTML=(pages[page]||pSoon)();tick();if(pending&&page==='b-clock')attachCam();else stopCam()}

/* ---------- Events (delegated) ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t],[data-go],[data-ap],[data-cat],[data-add],[data-q],[data-ot],[data-clear],[data-charge],[data-k],[data-tg],[data-vo],[data-vx],[data-rf],[data-rs],[data-rl],[data-rm],[data-rfgo],[data-of],[data-cam],[data-np],[data-npgo]');
  if(!t)return;
  const d=t.dataset;
  if('np' in d){npOpen=!npOpen;render();return}
  if('npgo' in d){
    const err=$('#npErr'),date=$('#npDate').value;
    const picked=[...document.querySelectorAll('[data-it]')].filter(x=>x.value.trim());
    if(!date||date<minDate()){err.textContent='Pick a delivery date at least 48 hours from now.';return}
    if(!picked.length){err.textContent='Choose at least one item.';return}
    poSeq++;const no='PO-2611-'+String(42+poSeq).padStart(4,'0');
    POs.unshift({no,br:'Cainta, Sto. Ni\u00f1o',d:'Nov 19',items:picked.length,amt:null,st:'Requested'});
    npOpen=false;render();toast(no+' sent to HQ for approval \u00b7 '+picked.length+' items');return}
  if(d.cam){
    if(d.cam==='cancel'){pending=null;msg={t:'Enter your 6-digit PIN',k:'mute'};render()}
    else if(d.cam==='skip'){finishPunch(false)}
    else{const v=document.querySelector('.viewf');if(v)v.classList.add('flash');const photo=shot();setTimeout(()=>finishPunch(photo),450)}
    return}
  if(d.vo){selOrd=d.vo;render();return}
  if('vx' in d){selOrd=null;render();return}
  if(d.of){ordF=d.of;render();return}
  if(d.rf){refSel=d.rf;refChk=new Set();refMode='Refund';refMsg=null;go('b-ref');return}
  if(d.rs){refSel=d.rs;refChk=new Set();refMode='Refund';refMsg=null;render();return}
  if(d.rl!==undefined){const i=+d.rl;refChk.has(i)?refChk.delete(i):refChk.add(i);render();return}
  if(d.rm){refMode=d.rm;refChk=new Set();refMsg=null;render();return}
  if('rfgo' in d){
    const o=orders.find(x=>x.no===refSel);const pin=($('#rfpin')||{}).value;
    if(pin!==MGR_PIN){refMsg={k:'bad',t:'Manager PIN is missing or wrong.'};render();return}
    if(refMode==='Void'){o.st='Voided';o.reason=refReason;refMsg={k:'good',t:o.no+' voided. Reason saved: '+refReason+'.'}}
    else{
      if(!refChk.size){refMsg={k:'bad',t:'Pick at least one item to refund.'};render();return}
      const amt=o.items.reduce((a,l,i)=>refChk.has(i)?a+l.q*l.p:a,0);
      o.rl=[...(o.rl||[]),...refChk];o.ref=(o.ref||0)+amt;o.reason=refReason;
      o.st=o.rl.length===o.items.length?'Refunded':'Part refunded';
      refMsg={k:'good',t:peso(amt)+' refunded on '+o.no+'. Reason saved: '+refReason+'.'};
    }
    toast(o.no+(refMode==='Void'?' voided':' refunded'));refSel=null;refChk=new Set();render();return
  }
  if(t.dataset.tg){const p=prods.find(x=>x.id==t.dataset.tg);p.on=!p.on;toast(p.n+(p.on?' is active':' is hidden from the POS'));render();return}
  if(t.dataset.t){toast(t.dataset.t);return}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go);return}
  if(t.dataset.ap){const p=POs.find(x=>x.no===t.dataset.ap);p.st='Pending';toast(p.no+' approved');render();return}
  if(t.dataset.cat){cat=t.dataset.cat;render();return}
  if(t.dataset.ot){orderType=t.dataset.ot;render();return}
  if(t.dataset.add){const p=prods.find(x=>x.id==t.dataset.add);const l=cart.find(x=>x.id===p.id);l?l.q++:cart.push({id:p.id,n:p.n,p:p.p,q:1});render();return}
  if(t.dataset.q){const [id,d]=t.dataset.q.split(':');const l=cart.find(x=>x.id==id);l.q+=+d;cart=cart.filter(x=>x.q>0);render();return}
  if('clear' in t.dataset){cart=[];render();return}
  if('charge' in t.dataset){const n=cart.reduce((a,l)=>a+l.q,0),s=cart.reduce((a,l)=>a+l.p*l.q,0);const no='ORD-'+(1059+orders.length-8);orders.unshift({no,t:fmt(new Date()),type:orderType,pay:'Cash',cashier:'Maria Santos',st:'Paid',items:cart.map(l=>({n:l.n,q:l.q,p:l.p}))});cart=[];render();toast(no+' paid · '+n+' items · '+peso(s));return}
  if(t.dataset.k!==undefined){key(t.dataset.k)}
});
document.addEventListener('input',e=>{if(e.target.id==='ordq'||e.target.id==='rfq'){const id=e.target.id;if(id==='ordq')ordQ=e.target.value;else refQ=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById(id);i.focus();i.setSelectionRange(pos,pos);return}if(e.target.id==='emq'||e.target.id==='brq'){const f=e.target.id==='emq';if(f)empQ=e.target.value;else brQ=e.target.value;const pos=e.target.selectionStart,id=e.target.id;render();const i=document.getElementById(id);i.focus();i.setSelectionRange(pos,pos);return}if(e.target.id==='prq'){prodQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#prq');i.focus();i.setSelectionRange(pos,pos);return}if(e.target.id==='poq'){poQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#poq');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='prc'){prodCat=e.target.value;render()}if(e.target.id==='rfr'){refReason=e.target.value}if(e.target.id==='emr'){empRole=e.target.value;render()}if(e.target.id==='emb'){empBr=e.target.value;render()}if(e.target.id==='pof'){poFilter=e.target.value;render()}if(e.target.id==='attb'){attBr=e.target.value;render()}});

function key(k){
  if(k==='C'){pinBuf=''}
  else if(k==='⌫'){pinBuf=pinBuf.slice(0,-1)}
  else if(pinBuf.length<6){pinBuf+=k}
  if(pinBuf.length===6){
    const emp=emps.find(x=>x.pin===pinBuf&&x.br==='Cainta, Sto. Niño');
    pinBuf='';
    if(!emp){msg={t:'PIN not recognised. Try again.',k:'bad'}}
    else{pending=emp;msg={t:'Enter your 6-digit PIN',k:'mute'};render();return}
  }
  render();
}

/* ---------- Login (prototype only: any password works) ---------- */
function signIn(email){
  const e=email.toLowerCase();
  role=e.startsWith('admin')?'admin':e.startsWith('cashier')?'cashier':e.startsWith('employee')?'employee':'manager';
  $('#login').hidden=true;
  $('#surfSeg').hidden=role!=='admin'; /* only HQ can switch; branch accounts never see the Admin menu */
  if(role==='admin'||role==='manager')setSurface(role==='admin'?'admin':'branch');
  else{surface='branch';go(role==='cashier'?'b-pos':'b-clock')}
  toast('Signed in as '+{admin:'HQ admin',manager:'Cainta manager',cashier:'cashier',employee:'employee'}[role]);
}
$('#loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const em=$('#lEmail').value.trim(),pw=$('#lPass').value;
  if(!em||!/^\S+@\S+\.\S+$/.test(em)){$('#lErr').textContent='Enter your email address.';$('#lEmail').focus();return}
  if(!pw){$('#lErr').textContent='Enter your password.';$('#lPass').focus();return}
  if(!/^(admin|cainta|cashier|employee)/i.test(em)){$('#lErr').textContent='We could not find that account. Try a demo account below.';return}
  $('#lErr').textContent='';signIn(em);
});
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>signIn(b.dataset.demo));
$('#lForgot').onclick=e=>{e.preventDefault();toast('Reset link would be emailed')};
$('#signOut').onclick=()=>{$('#lPass').value='';$('#lEmail').value='';$('#login').hidden=false;$('#lEmail').focus()};

renderNav();render();
</script>
